name: Windows build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust update failed' }
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustup component add rustfmt clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
      - name: Check formatting and tests
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting check failed' }
          cargo clippy --locked --all-targets --all-features --target x86_64-pc-windows-msvc -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo test --locked --all-features --all-targets --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build and check rendering without a headset
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc --bin audeze-overlay --bin preview-layouts
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          & 'target/x86_64-pc-windows-msvc/release/preview-layouts.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Layout check failed' }
      - name: Package portable app and installer
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $match = Select-String -LiteralPath Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -ne "v$version") { throw 'Release tag must match the version in Cargo.toml' }
            $label = $version
          } else {
            $label = "$version-dev.$($env:COMMIT_SHA.Substring(0, 8))"
          }
          ./tools/package.ps1 -BuildLabel $label -BinaryPath 'target/x86_64-pc-windows-msvc/release/audeze-overlay.exe'
      - name: Upload Windows downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64
          path: |
            dist/release/*.exe
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
            dist/release/DEPENDENCY-LICENSES.txt
            dist/release/THIRD-PARTY-NOTICES.md
            dist/release/LICENSE
          if-no-files-found: error
          retention-days: 30
      - name: Upload layout previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: layout-previews
          path: diagnostics/layout-*.png
          if-no-files-found: ignore

  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
          path: release
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $development = $env:REF_TYPE -ne 'tag'
          $tag = if ($development) { 'development' } else { $env:REF_NAME }
          $title = if ($development) { 'Latest main build' } else { $tag }
          if ($development) {
            gh api "repos/$env:GH_REPO/git/ref/tags/$tag" *> $null
            if ($LASTEXITCODE -eq 0) {
              gh api --method PATCH "repos/$env:GH_REPO/git/refs/tags/$tag" -f "sha=$env:COMMIT_SHA" -F force=true > $null
            } else {
              gh api --method POST "repos/$env:GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:COMMIT_SHA" > $null
            }
            if ($LASTEXITCODE -ne 0) { throw 'Could not update development tag' }
          }
          $files = @(Get-ChildItem -LiteralPath release -File | ForEach-Object FullName)
          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --repo $env:GH_REPO --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          } else {
            $options = @('--verify-tag', '--title', $title)
            if (!$development -and $tag.Contains('-')) {
              $options += @('--prerelease', '--latest=false')
            } else {
              $options += '--latest'
            }
            if (!$development) { $options += '--generate-notes' }
            gh release create $tag @files --repo $env:GH_REPO @options
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          if ($development) {
            "Automatically built and tested from main at commit $env:COMMIT_SHA. Download the setup EXE for installation, or the portable ZIP. This rolling release is updated after successful main builds; version tags publish separate numbered releases. Packages are unsigned." | Set-Content -LiteralPath release-notes.txt
            # Promote existing prereleases too, so GitHub lists the main build as Latest.
            gh release edit $tag --repo $env:GH_REPO --title $title --notes-file release-notes.txt --draft=false --prerelease=false --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed' }
            # Remove superseded build filenames only after the new files uploaded.
            $assetJson = gh release view $tag --repo $env:GH_REPO --json assets
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect uploaded assets' }
            $currentNames = @($files | ForEach-Object { [IO.Path]::GetFileName($_) })
            foreach ($asset in ($assetJson | ConvertFrom-Json).assets) {
              if ($asset.name -notin $currentNames) {
                gh release delete-asset $tag $asset.name --repo $env:GH_REPO --yes
                if ($LASTEXITCODE -ne 0) { throw 'Could not remove an obsolete development asset' }
              }
            }
            $latestJson = gh api "repos/$env:GH_REPO/releases/latest"
            if ($LASTEXITCODE -ne 0) { throw 'Latest release is not publicly available' }
            $latest = $latestJson | ConvertFrom-Json
            if ($latest.tag_name -ne $tag -or $latest.draft -or $latest.prerelease) {
              throw 'Main build was not published as the latest public release'
            }
            foreach ($name in $currentNames) {
              if ($name -notin $latest.assets.name) { throw "Latest release is missing $name" }
            }
          }
