name: macOS build and checks

# Called by the build/release workflow so all packages belong to the same run.
# Manual runs produce artifacts only; publication remains in windows.yml.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Apple-silicon runner; the bundle is thin arm64 for now.
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check formatting, lints and tests
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: Build and check rendering without a headset
        run: |
          cargo build --locked --release --bin audeze-overlay --bin preview-layouts
          target/release/preview-layouts
      - name: Package the app bundle and disk image
        run: packaging/macos/package-macos.sh
      - name: Upload the macOS disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Audeze-Overlay-macOS-arm64
          path: |
            dist/Audeze-Overlay-macOS-arm64.dmg
            dist/Audeze-Overlay-macOS-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload layout previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: layout-previews-macos
          path: diagnostics/layout-*.png
          if-no-files-found: ignore
          retention-days: 14
