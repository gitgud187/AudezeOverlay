name: Windows build and release

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust update failed' }
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustup component add rustfmt clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
      - name: Check formatting and tests
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting check failed' }
          cargo clippy --locked --all-targets --all-features --target x86_64-pc-windows-msvc -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo test --locked --all-features --all-targets --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build and check rendering without a headset
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc --bin audeze-overlay --bin preview-layouts
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          & 'target/x86_64-pc-windows-msvc/release/preview-layouts.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Layout check failed' }
      - name: Package portable app and installer
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $match = Select-String -LiteralPath Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -ne "v$version") { throw 'Release tag must match the version in Cargo.toml' }
            $label = $version
          } else {
            $label = "$version-dev.$($env:COMMIT_SHA.Substring(0, 8))"
          }
          ./tools/package.ps1 -BuildLabel $label -BinaryPath 'target/x86_64-pc-windows-msvc/release/audeze-overlay.exe'
      - name: Upload Windows downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64
          path: |
            dist/release/Audeze-Overlay-Setup.exe
            dist/release/Audeze-Overlay-Portable.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload layout previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: layout-previews
          path: diagnostics/layout-*.png
          if-no-files-found: ignore

  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
          path: release
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $development = $env:REF_TYPE -ne 'tag'
          $tag = if ($development) { 'development' } else { $env:REF_NAME }
          $title = if ($development) { 'Latest main build' } else { $tag }
          $changes = ''
          if ($development) {
            $previousJson = gh api "repos/$env:GH_REPO/git/ref/tags/$tag" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $previousSha = ($previousJson | ConvertFrom-Json).object.sha
              if ($previousSha -ne $env:COMMIT_SHA) {
                $comparisonJson = gh api "repos/$env:GH_REPO/compare/$previousSha...$env:COMMIT_SHA"
                if ($LASTEXITCODE -ne 0) { throw 'Could not generate release changelog' }
                $comparison = $comparisonJson | ConvertFrom-Json
                $changes = (@($comparison.commits | ForEach-Object {
                  $subject = ($_.commit.message -split "`n")[0]
                  "- $subject ([commit]($($_.html_url)))"
                }) -join "`n") + "`n`n[Full changelog]($($comparison.html_url))"
              } else {
                $changes = 'Rebuilt the current main commit; no additional code changes.'
                $existingBody = gh release view $tag --repo $env:GH_REPO --json body --jq .body
                if ($LASTEXITCODE -eq 0 -and ($existingBody -join "`n") -match "(?s)## What's new\s+(.*?)\s+### Build details") {
                  $changes = $Matches[1]
                }
              }
              gh api --method PATCH "repos/$env:GH_REPO/git/refs/tags/$tag" -f "sha=$env:COMMIT_SHA" -F force=true > $null
            } else {
              $changes = 'First downloadable main build. See the README for supported features and setup.'
              gh api --method POST "repos/$env:GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:COMMIT_SHA" > $null
            }
            if ($LASTEXITCODE -ne 0) { throw 'Could not update development tag' }
          }
          if (!$development) {
            $generatedJson = gh api --method POST "repos/$env:GH_REPO/releases/generate-notes" -f "tag_name=$tag" -f "target_commitish=$env:COMMIT_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Could not generate version release changelog' }
            $changes = ($generatedJson | ConvertFrom-Json).body
          }
          $download = "https://github.com/$env:GH_REPO/releases/download/$tag"
          @(
            '## Download for Windows 11 (64-bit)',
            '',
            "**[Install Audeze Overlay — recommended]($download/Audeze-Overlay-Setup.exe)**",
            '',
            'Run the installer, then open Audeze Overlay from the Start menu.',
            '',
            "[Portable ZIP — no installation]($download/Audeze-Overlay-Portable.zip): extract the ZIP and run Audeze Overlay.exe.",
            '',
            'Both downloads include the app and licenses. Source code archives are for developers. SHA256SUMS.txt is optional for verifying downloads.',
            '',
            "## What's new",
            '',
            $changes,
            '',
            '### Build details',
            '',
            "Built from commit $env:COMMIT_SHA. Packages are unsigned."
          ) | Set-Content -LiteralPath release-notes.txt
          $files = @(Get-ChildItem -LiteralPath release -File | ForEach-Object FullName)
          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --repo $env:GH_REPO --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          } else {
            $options = @('--verify-tag', '--title', $title, '--notes-file', 'release-notes.txt')
            if (!$development -and $tag.Contains('-')) {
              $options += @('--prerelease', '--latest=false')
            } else {
              $options += '--latest'
            }
            gh release create $tag @files --repo $env:GH_REPO @options
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release edit $tag --repo $env:GH_REPO --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release changelog update failed' }
          if ($development) {
            # Promote existing prereleases too, so GitHub lists the main build as Latest.
            gh release edit $tag --repo $env:GH_REPO --title $title --notes-file release-notes.txt --draft=false --prerelease=false --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed' }
            # Remove superseded build filenames only after the new files uploaded.
            $assetJson = gh release view $tag --repo $env:GH_REPO --json assets
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect uploaded assets' }
            $currentNames = @($files | ForEach-Object { [IO.Path]::GetFileName($_) })
            foreach ($asset in ($assetJson | ConvertFrom-Json).assets) {
              if ($asset.name -notin $currentNames) {
                gh release delete-asset $tag $asset.name --repo $env:GH_REPO --yes
                if ($LASTEXITCODE -ne 0) { throw 'Could not remove an obsolete development asset' }
              }
            }
            $latestJson = gh api "repos/$env:GH_REPO/releases/latest"
            if ($LASTEXITCODE -ne 0) { throw 'Latest release is not publicly available' }
            $latest = $latestJson | ConvertFrom-Json
            if ($latest.tag_name -ne $tag -or $latest.draft -or $latest.prerelease) {
              throw 'Main build was not published as the latest public release'
            }
            foreach ($name in $currentNames) {
              if ($name -notin $latest.assets.name) { throw "Latest release is missing $name" }
            }
          }
